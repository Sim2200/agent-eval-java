id: summarizer
name: Document summarizer
cases:
  - id: s-001
    input: "The renewable energy sector is growing rapidly. Solar panels are becoming more affordable. Wind turbines generate clean power. Many countries are investing heavily in green technology."
    output: "The renewable energy sector has been expanding since 1800 with decreasing costs for solar and wind power generation."
    checks:
      - type: llm_judge
        rubric: "Captures main topic of renewable energy and technology. expects: renewable, energy, solar, wind; rejects: coal, fossil"
      - type: contains
        text: "renewable"
      - type: must_not_fire
        phrases: ["1800"]
        should_pass: false
