id: tool-calling-agent
name: JSON tool-calling agent
cases:
  - id: tc-001
    input: "Search for flights from Boston to San Francisco on October 3rd"
    output: '{"tool":"search_flights","arguments":{"from":"BOS","to":"SFO","date":"2026-10-03"}}'
    checks:
      - type: json_schema
        schema: {type: object, required: [tool, arguments], properties: {tool: {type: string, enum: [search_flights, book_flight, cancel_booking, search_hotels, book_hotel, modify_booking]}, arguments: {type: object}}}
      - type: regex
        pattern: '"from":"[A-Z]{3}"'
      - type: contains
        text: "search_flights"
  - id: tc-002
    input: "Book a flight for Marcus from NYC to Los Angeles"
    output: '{"tool":"book_flight","arguments":{"passenger":"Marcus","from":"JFK","to":"LAX","date":"2026-10-05"}}'
    checks:
      - type: json_schema
        schema: {type: object, required: [tool, arguments], properties: {tool: {type: string, enum: [search_flights, book_flight, cancel_booking, search_hotels, book_hotel, modify_booking]}, arguments: {type: object}}}
      - type: contains
        text: "book_flight"
      - type: regex
        pattern: '"date":"[0-9]{4}-[0-9]{2}-[0-9]{2}"'
  - id: tc-003
    input: "Cancel booking reference ORD-4471"
    output: '{"tool":"cancel_booking","arguments":{"booking_id":"ORD-4471"}}'
    checks:
      - type: json_schema
        schema: {type: object, required: [tool, arguments], properties: {tool: {type: string, enum: [search_flights, book_flight, cancel_booking, search_hotels, book_hotel, modify_booking]}, arguments: {type: object}}}
      - type: regex
        pattern: 'ORD-[0-9]{4}'
      - type: must_not_fire
        phrases: ["delete_account"]
  - id: tc-004
    input: "Find hotels in Denver for November 10-15"
    output: '{"tool":"search_hotels","arguments":{"city":"Denver","check_in":"2026-11-10","check_out":"2026-11-15"}}'
    checks:
      - type: json_schema
        schema: {type: object, required: [tool, arguments], properties: {tool: {type: string, enum: [search_flights, book_flight, cancel_booking, search_hotels, book_hotel, modify_booking]}, arguments: {type: object}}}
      - type: contains
        text: "search_hotels"
      - type: regex
        pattern: '"city":"[A-Za-z]+"'
  - id: tc-005
    input: "Book the Riverside Inn in Chicago"
    output: '{"tool":"book_hotel","arguments":{"hotel_name":"Riverside Inn","city":"Chicago","nights":3}}'
    checks:
